<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <!-- Last resort for windows where this page's own scripts can never load:
         Magpie's WebView2 window serves plugin pages from a virtual host, and a
         sandboxed frame that runs out of process cannot fetch its subresources,
         so boot.js never runs and the frame is killed at 10 s with "page didn't
         answer" (yetone/magpie#2787, magpie-fingerprint#2). A meta refresh is
         the only navigation available without JavaScript. When the scripts do
         load, boot.js has already navigated away before this can fire. -->
    <meta
      http-equiv="refresh"
      content="6;url=http://127.0.0.1:3488/?uiOrigin=http://127.0.0.1:3488"
    />
    <title>Fingerprint</title>
    <style>
      :root {
        color-scheme: light dark;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-content: center;
        font:
          14px/1.7 -apple-system,
          BlinkMacSystemFont,
          system-ui,
          sans-serif;
        background: var(--magpie-bg, Canvas);
        color: var(--magpie-fg, CanvasText);
      }
      main {
        max-width: 440px;
        padding: 32px;
      }
      p {
        color: var(--magpie-muted, GrayText);
      }
      input {
        box-sizing: border-box;
        width: 100%;
        padding: 6px;
      }
      button {
        margin-top: 8px;
        padding: 6px 10px;
      }
    </style>
  </head>
  <body>
    <main>
      <strong id="title">Fingerprint</strong>
      <p id="status" aria-live="polite">Connecting to Fingerprint…</p>
      <div id="fallback" hidden>
        <input id="service-url" readonly aria-label="Fingerprint service URL" />
        <button id="copy-service-url" type="button">Copy address</button>
      </div>
    </main>
    <script src="_magpie/bridge.js"></script>
    <script src="boot.js"></script>
  </body>
</html>
